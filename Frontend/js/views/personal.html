<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRM - Gestión de Personal</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/personal.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="top-bar">
                <h1>Gestión de Personal</h1>
                <div class="user-profile">
                    <span id="txt-user-role">Rol: Administrador</span>
                </div>
            </header>
            
            <section class="personal-section">
                <div class="toolbar">
                    <input type="text" id="search-employee" class="search-input" placeholder="Buscar por nombre o puesto...">
                    <button class="btn-primary" id="btn-add-employee">+ Nuevo Empleado</button>
                </div>

                <div class="table-container">
                    <table class="crm-table">
                        <thead>
                            <tr>
                                <th>Nombre Completo</th>
                                <th>Puesto</th>
                                <th>Turno</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="personal-table-body">
                            <tr>
                                <td>Carlos Martínez</td>
                                <td>Jefe de Sala</td>
                                <td>Completo (Partido)</td>
                                <td><span class="badge active">Activo</span></td>
                                <td class="action-cells">
                                    <button class="btn-icon" title="Editar">✏️</button>
                                    <button class="btn-icon delete" title="Dar de baja">🗑️</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Lucía Gómez</td>
                                <td>Camarera</td>
                                <td>Tarde</td>
                                <td><span class="badge active">Activo</span></td>
                                <td class="action-cells">
                                    <button class="btn-icon" title="Editar">✏️</button>
                                    <button class="btn-icon delete" title="Dar de baja">🗑️</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Miguel Ruiz</td>
                                <td>Cocinero</td>
                                <td>Mañana</td>
                                <td><span class="badge inactive">Baja / Vacaciones</span></td>
                                <td class="action-cells">
                                    <button class="btn-icon" title="Editar">✏️</button>
                                    <button class="btn-icon delete" title="Dar de baja">🗑️</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
