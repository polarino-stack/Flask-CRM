<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestauranteCRM - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>RestauranteCRM</h2>
                <p>Accede al panel de control</p>
            </div>

            <form id="form-login">
                <div class="input-group">
                    <label for="username">Usuario / Empleado</label>
                    <input type="text" id="username" placeholder="Introduce tu usuario" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <div id="error-message" class="error-msg" style="display: none;">
                Credenciales incorrectas. Inténtalo de nuevo.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', function (e) {
            e.preventDefault();

            // Guardamos el token de prueba
            localStorage.setItem("jwt_token", "token_simulado_para_pruebas");

            // Redirección relativa estricta siguiendo tu árbol de carpetas
            window.location.href = "js/views/dashboard.html";
        });
    </script>
</body>

</html>
